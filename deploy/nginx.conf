# Ashxobod Sayilgohi — static site
#
# Debian/Ubuntu:  /etc/nginx/sites-available/ashhobod  (then symlink into sites-enabled)
# RHEL/Alma/Rocky: /etc/nginx/conf.d/ashhobod.conf
#
# Change server_name to your domain, then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    server_name ashxobod.example.uz;          # <-- CHANGE ME

    root /var/www/ashhobod/dist;
    index index.html;

    # The whole site is one self-contained index.html using hash routing
    # (#/booking, #/miniapp), so the server never needs to know about routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is regenerated on every deploy — never let a browser pin an old build
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    location ~* \.(jpg|jpeg|png|ico|svg)$ {
        expires 7d;
        add_header Cache-Control "public" always;
    }

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Prototype for a real business with a booking flow that does not really book.
    # Keep it out of search results so the park's customers cannot land on it by accident.
    # Delete this line (and robots.txt) only once the park adopts it as their real site.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # index.html is ~600 KB, but most of that is base64 image data which barely
    # compresses. The markup/CSS/JS portion still shrinks a lot, so this is worth it.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    access_log /var/log/nginx/ashhobod.access.log;
    error_log  /var/log/nginx/ashhobod.error.log;
}
