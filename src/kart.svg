<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470">
  <defs>
    <linearGradient id="kBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48dee9"/>
      <stop offset=".5" stop-color="#12aebb"/>
      <stop offset="1" stop-color="#0a8b96"/>
    </linearGradient>
    <linearGradient id="kPod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e469d4"/>
      <stop offset="1" stop-color="#a52d99"/>
    </linearGradient>
    <linearGradient id="kNose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ef8b0e"/>
    </linearGradient>
    <radialGradient id="kTyre" cx=".36" cy=".28" r=".9">
      <stop offset="0" stop-color="#525667"/>
      <stop offset="1" stop-color="#15181f"/>
    </radialGradient>
    <radialGradient id="gShadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2b1b3d" stop-opacity=".4"/>
      <stop offset="1" stop-color="#2b1b3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kVisor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38456b"/>
      <stop offset="1" stop-color="#0c1020"/>
    </linearGradient>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="400" cy="418" rx="300" ry="40" fill="url(#gShadow)"/>

  <g stroke="#2b1b3d" stroke-width="9" stroke-linejoin="round" stroke-linecap="round">

    <!-- ================= rear plane ================= -->
    <!-- rear wing -->
    <rect x="246" y="140" width="308" height="30" rx="15" fill="#c53fb4"/>
    <rect x="268" y="168" width="16" height="30" rx="8" fill="#7d3a9e"/>
    <rect x="516" y="168" width="16" height="30" rx="8" fill="#7d3a9e"/>
    <rect x="330" y="166" width="18" height="64" rx="9" fill="#7d3a9e"/>
    <rect x="452" y="166" width="18" height="64" rx="9" fill="#7d3a9e"/>

    <!-- rear tyres (wider track, further away) -->
    <g>
      <ellipse cx="148" cy="278" rx="52" ry="60" fill="url(#kTyre)"/>
      <ellipse cx="652" cy="278" rx="52" ry="60" fill="url(#kTyre)"/>
      <ellipse cx="148" cy="278" rx="21" ry="25" fill="#ffc95e"/>
      <ellipse cx="652" cy="278" rx="21" ry="25" fill="#ffc95e"/>
    </g>
    <!-- rear axle bar -->
    <rect x="176" y="262" width="448" height="22" rx="11" fill="#4a3a63"/>

    <!-- ================= driver ================= -->
    <!-- torso / racing suit -->
    <path d="M400 190 c-52 0 -84 14 -98 36 l-18 44 q116 26 232 0 l-18 -44 c-14 -22 -46 -36 -98 -36 z" fill="#ff4f9d"/>
    <path d="M300 232 q100 22 200 0 l7 18 q-107 24 -214 0 z" fill="#e02e7f" stroke-width="7"/>
    <!-- helmet -->
    <path d="M400 106 c-48 0 -82 34 -82 78 0 20 8 34 20 42 h124 c12 -8 20 -22 20 -42 0 -44 -34 -78 -82 -78 z" fill="#f7f4ff"/>
    <path d="M400 106 c-32 0 -58 16 -71 40 h142 c-13 -24 -39 -40 -71 -40 z" fill="#12aebb"/>
    <path d="M336 184 q-6 -18 0 -32 22 -10 128 0 6 14 0 32 q-64 12 -128 0 z" fill="url(#kVisor)"/>
    <path d="M348 160 q40 -8 84 -2" stroke="#7f93c8" stroke-width="7" fill="none" opacity=".85"/>

    <!-- ================= side pods ================= -->
    <path d="M232 340 q-22 -66 26 -80 l84 -14 8 100 -88 14 q-24 4 -30 -20 z" fill="url(#kPod)"/>
    <path d="M568 340 q22 -66 -26 -80 l-84 -14 -8 100 88 14 q24 4 30 -20 z" fill="url(#kPod)"/>

    <!-- ================= chassis ================= -->
    <path d="M338 240 h124 q28 0 33 28 l18 84 q5 30 -29 30 h-168 q-34 0 -29 -30 l18 -84 q5 -28 33 -28 z" fill="url(#kBody)"/>
    <path d="M352 258 h96" stroke="#bff4f8" stroke-width="10" opacity=".55" fill="none"/>

    <!-- steering wheel + gloves -->
    <path d="M340 268 h120 q12 0 12 12 v8 q0 12 -12 12 h-24 q-10 0 -10 -8 h-52 q0 8 -10 8 h-24 q-12 0 -12 -12 v-8 q0 -12 12 -12 z" fill="#241a35" stroke-width="7"/>
    <rect x="316" y="262" width="42" height="34" rx="14" fill="#f7f4ff" stroke-width="7"/>
    <rect x="442" y="262" width="42" height="34" rx="14" fill="#f7f4ff" stroke-width="7"/>

    <!-- ================= nose cone (closest) ================= -->
    <path d="M330 306 h140 q26 0 30 24 l12 56 q5 28 -28 28 h-168 q-33 0 -28 -28 l12 -56 q4 -24 30 -24 z" fill="url(#kNose)"/>
    <path d="M344 328 l-8 44" stroke="#fff3d4" stroke-width="9" opacity=".6" fill="none"/>
    <path d="M456 328 l8 44" stroke="#fff3d4" stroke-width="9" opacity=".6" fill="none"/>
    <rect x="346" y="330" width="108" height="54" rx="16" fill="#ffffff"/>
    <text x="400" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900"
          text-anchor="middle" fill="#c53fb4" stroke="none">01</text>

    <!-- ================= front tyres ================= -->
    <ellipse cx="212" cy="336" rx="64" ry="74" fill="url(#kTyre)"/>
    <ellipse cx="588" cy="336" rx="64" ry="74" fill="url(#kTyre)"/>
    <ellipse cx="212" cy="336" rx="28" ry="32" fill="#12aebb"/>
    <ellipse cx="588" cy="336" rx="28" ry="32" fill="#12aebb"/>
    <ellipse cx="212" cy="336" rx="9" ry="11" fill="#ffffff" stroke-width="6"/>
    <ellipse cx="588" cy="336" rx="9" ry="11" fill="#ffffff" stroke-width="6"/>

    <!-- front bumper -->
    <rect x="284" y="390" width="232" height="30" rx="15" fill="#ff4f9d"/>
  </g>

  <!-- speed streaks (animated in CSS) -->
  <g id="kartSpeed" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity=".85">
    <path d="M56 214 h74"/>
    <path d="M18 262 h48"/>
    <path d="M40 316 h58"/>
    <path d="M744 214 h-74"/>
    <path d="M782 262 h-48"/>
    <path d="M760 316 h-58"/>
  </g>

  <!-- logo sparkles -->
  <g stroke="#2b1b3d" stroke-width="6" stroke-linejoin="round">
    <path d="M96 128 l13 32 32 13 -32 13 -13 32 -13 -32 -32 -13 32 -13 z" fill="#ffc95e"/>
    <path d="M706 168 l11 27 27 11 -27 11 -11 27 -11 -27 -27 -11 27 -11 z" fill="#12aebb"/>
    <path d="M646 92 l9 22 22 9 -22 9 -9 22 -9 -22 -22 -9 22 -9 z" fill="#c53fb4"/>
  </g>
</svg>
